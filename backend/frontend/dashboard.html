<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - StudyAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar com logo -->
        <div class="sidebar">
            <img src="logo.png" alt="StudyAI Logo" class="logo">
            <ul>
                <li>📘 Matérias</li>
                <li>❓ Quizzes</li>
                <li>⏻ Sair</li>
            </ul>
        </div>

        <!-- Conteúdo principal -->
        <div class="main-content">
            <h2>Minhas Matérias</h2>
            <button class="add-button">+ Adicionar Matéria</button>

            <div class="card-grid">
                <div class="card">
                    <h3>Banco de Dados</h3>
                    <button class="edit">Editar</button>
                    <button class="delete">Excluir</button>
                </div>
                <div class="card">
                    <h3>Inteligência Artificial</h3>
                    <button class="edit">Editar</button>
                    <button class="delete">Excluir</button>
                </div>
                <div class="card">
                    <h3>Algoritmos</h3>
                    <button class="edit">Editar</button>
                    <button class="delete">Excluir</button>
                </div>
                <div class="card">
                    <h3>Redes de Computadores</h3>
                    <button class="edit">Editar</button>
                    <button class="delete">Excluir</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
